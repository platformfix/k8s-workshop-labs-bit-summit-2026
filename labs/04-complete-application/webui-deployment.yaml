apiVersion: apps/v1
kind: Deployment
metadata:
  name: webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webui
  template:
    metadata:
      labels:
        app: webui
    spec:
      containers:
        - name: webui
          image: ghcr.io/platformfix/k8coins-webui:v0.2.1
          envFrom:
            - configMapRef:
                name: k8coins-config
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: webui
spec:
  selector:
    app: webui
  ports:
    - port: 80
      targetPort: 80
