apiVersion: apps/v1
kind: Deployment
metadata:
  name: hasher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hasher
  template:
    metadata:
      labels:
        app: hasher
    spec:
      containers:
        - name: hasher
          image: ghcr.io/platformfix/k8coins-hasher:v0.2.1
          envFrom:
            - configMapRef:
                name: k8coins-config
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hasher
spec:
  selector:
    app: hasher
  ports:
    - port: 80
      targetPort: 80
