apiVersion: apps/v1
kind: Deployment
metadata:
  name: webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webui
  template:
    metadata:
      labels:
        app: webui
    spec:
      containers:
        - name: webui
          image: ghcr.io/platformfix/k8coins-webui:latest
          command: ["sh", "-c"]
          args:
            - |
              if [ -z "$SERVICE_NAME" ]; then
                echo "FATAL: SERVICE_NAME is required but not set" >&2
                exit 1
              fi
              exec node webui.js
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: webui
spec:
  selector:
    app: webui
  ports:
    - port: 80
      targetPort: 80
