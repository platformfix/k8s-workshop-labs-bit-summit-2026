apiVersion: apps/v1
kind: Deployment
metadata:
  name: rng
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rng
  template:
    metadata:
      labels:
        app: rng
    spec:
      containers:
        - name: rng
          image: ghcr.io/platformfix/k8coins-rng:v0.5.0
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: k8coins-config
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 5
