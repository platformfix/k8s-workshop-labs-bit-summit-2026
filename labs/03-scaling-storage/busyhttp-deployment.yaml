apiVersion: apps/v1
kind: Deployment
metadata:
  name: busyhttp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: busyhttp
  template:
    metadata:
      labels:
        app: busyhttp
    spec:
      containers:
        - name: busyhttp
          image: jpetazzo/busyhttp:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: busyhttp
spec:
  selector:
    app: busyhttp
  ports:
    - port: 80
      targetPort: 80
