apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  # The workshop cluster's class. On another cluster, name one of yours or
  # delete this line to take the default. Nothing here depends on the class.
  storageClassName: civo-volume
  resources:
    requests:
      storage: 1Gi
